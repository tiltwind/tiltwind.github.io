    <script type="text/javascript" src="https://unpkg.com/sql-formatter@15.3.2/dist/sql-formatter.min.js"></script>
 <script type="text/javascript">
function sql_format() {
    try {
        const sql = document.getElementById('sql').value;
        const formatted = sqlFormatter.format(sql, {
            language: 'sql',
            tabWidth: 2,
            keywordCase: 'upper',
            identifierCase: 'lower',
            functionCase: 'upper'
        });
        document.getElementById('result').textContent = formatted;
    } catch (error) {
        document.getElementById('result').textContent = 'Error formatting SQL: ' + error.message;
    }
}

function sql_formatp() {
    // Keep the same logic as sql_format for consistency
    sql_format();
}
</script>
</head>
<body>
<h1>SQL Format</h1>
<textarea id="sql" style="width:100%;" rows="20" >select * from foo</textarea><br />
<button onclick="sql_format()">Format SQL Statement</button>
<hr />
<strong>The result:</strong><br />
<pre id="result"></pre>
</body></html>
